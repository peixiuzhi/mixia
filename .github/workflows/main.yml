name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project MixiaVault.xcodeproj \
            -target MixiaVault \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            OBJROOT="$PWD/build/obj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 150
          test -d "build/Release-iphoneos/MixiaVault.app"

      - name: Package IPA
        run: |
          APP="build/Release-iphoneos/MixiaVault.app"
          ls -la "$APP"
          rm -rf Payload MixiaVault.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry MixiaVault.ipa Payload
          ls -lh MixiaVault.ipa
          echo "---- Info.plist ----"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MixiaVault-unsigned-ipa
          path: MixiaVault.ipa
          retention-days: 30
          if-no-files-found: error
